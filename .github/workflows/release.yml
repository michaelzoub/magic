# Builds the macOS and Windows installers when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0), checks that each packaged app
# actually starts, and attaches them to a draft GitHub Release. Review the
# draft, then publish it.
#
# macOS builds are ad-hoc signed (see electron-builder.yml). To sign with a
# Developer ID and notarize, add the CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID secrets and update the mac
# section of electron-builder.yml.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:agent

      - name: Package
        shell: bash
        run: |
          # Unconfigured secrets arrive as empty strings, which electron-builder
          # would treat as a certificate path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # A broken signature makes macOS call the app "damaged".
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict -vv dist/mac-arm64/Magic.app
          codesign --verify --deep --strict -vv dist/mac/Magic.app

      # MAGIC_SMOKE_TEST: load the UI, start the bundled agent server, exit 0/1.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: dist/mac-arm64/Magic.app/Contents/MacOS/Magic --user-data-dir="$RUNNER_TEMP/magic-smoke"
        env:
          MAGIC_SMOKE_TEST: '1'
          MODEL_API_KEY: smoke-test
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\win-unpacked\Magic.exe -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\magic-smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
        env:
          MAGIC_SMOKE_TEST: '1'
          MODEL_API_KEY: smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "magic $TAG" --notes ""
          gh release upload "$TAG" installers/* --clobber

# Packaging for direct downloads (GitHub Releases). Build locally with
# `npm run dist`; CI builds macOS and Windows on a `v*` tag
# (.github/workflows/release.yml).
appId: com.michaelzoub.magic
productName: Magic
copyright: Copyright © 2026 Magic contributors

directories:
  output: dist
  buildResources: build

# Everything the app runs is bundled into out/ by electron-vite, so no
# node_modules ship inside the app.
files:
  - out/**
  - package.json
  - "!node_modules/**"

# The prebuilt agent server (scripts/build-agent.mjs), run with Electron's
# own Node from Resources/agent — outside the asar so it can be executed.
extraResources:
  - from: .output
    to: agent
    filter:
      - "**/*"

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signature ("-"): free, and required — Apple silicon reports an
  # app with a broken signature as "damaged". Users still confirm the first
  # launch (Privacy & Security → Open Anyway) until the app is signed with
  # a Developer ID and notarized: replace "-" with that identity, set
  # hardenedRuntime and notarize to true (see README → Releasing).
  identity: "-"
  hardenedRuntime: false
  notarize: false

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false

# Packaging for direct downloads (GitHub Releases). Build locally with
# `npm run dist`; CI builds every platform on a `v*` tag
# (.github/workflows/release.yml).
appId: com.michaelzoub.magic
productName: Magic
copyright: Copyright © 2026 Magic contributors

directories:
  output: dist
  buildResources: build

# Everything the app runs is bundled into out/ by electron-vite, so no
# node_modules ship inside the app.
files:
  - out/**
  - package.json
  - "!node_modules/**"

# The prebuilt agent server (scripts/build-agent.mjs), run with Electron's
# own Node from Resources/agent — outside the asar so it can be executed.
extraResources:
  - from: .output
    to: agent
    filter:
      - "**/*"

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned unless CSC_LINK / APPLE_* secrets are configured (see README).
  hardenedRuntime: true
  notarize: false

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false

linux:
  category: Network
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Magic contributors

publish:
  provider: github
  owner: michaelzoub
  repo: magic
  releaseType: draft
